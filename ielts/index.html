<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0;url=/ielts/" />
  <title>IELTS PA</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0f172a;
      color: #f5f0e6;
      font-family: system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .box {
      text-align: center;
      padding: 24px;
    }
    .box h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    .box h1 span {
      color: #d4af37;
    }
    .box p {
      color: rgba(245, 240, 230, 0.65);
      font-size: 14px;
      margin: 0 0 14px;
    }
    .box a {
      color: #d4af37;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 8px 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>IELTS <span>PA</span></h1>
    <p>Redirecting to the app…</p>
    <a href="/ielts/">Open IELTS PA</a>
  </div>
  <script>try { location.replace('/ielts/'); } catch (e) {}</script>
</body>
</html>
